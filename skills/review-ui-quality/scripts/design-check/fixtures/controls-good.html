<!doctype html><meta charset=utf-8><style>
body{margin:0;padding:24px;font:16px/24px system-ui;background:#fff;color:#1d1d1f;display:grid;gap:16px;width:320px}
input[type=text]{height:44px;padding:0 16px;border:1px solid #c7c7cc;border-radius:12px;background:#fafafa;font:inherit;transition:border-color .15s,box-shadow .15s,background-color .15s}
input[type=text]:hover{border-color:#8e8e93;background:#fff}
input[type=text]:active{border-color:#0071e3}
input[type=text]:focus-visible{outline:3px solid #0a4a99;outline-offset:2px}
button{height:44px;padding:0 24px;border:0;border-radius:22px;background:#0071e3;color:#fff;font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:background-color .15s,transform .15s}
button:hover{background:#0a5fc4}button:active{transform:scale(.97);background:#084a9b}
button:focus-visible{outline:3px solid #0a4a99;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><input type=text aria-label=Name placeholder=Name><button>Continue</button>

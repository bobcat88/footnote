<!doctype html><meta charset=utf-8><title>fixture</title><style>body{margin:0;font:16px/1.5 system-ui}main{max-width:1200px;margin:0 auto;padding:48px 0}.carousel{width:600px;height:80px;border:1px solid #ccc;padding:8px}</style><main><h1>Highlights</h1><div class=carousel id=c><p class=slide>Slide 0 with some words</p><button aria-label="Pause slides">Pause</button></div></main><script>let n=0,h=false;const c=document.getElementById("c");c.onmouseenter=()=>h=true;c.onmouseleave=()=>h=false;setInterval(()=>{if(h)return;n++;document.querySelector(".slide").textContent="Slide "+n+" with some words"},150)</script>

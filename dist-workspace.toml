[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Allow SHA-pinned GitHub Actions in .github/workflows/release.yml
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Windows and Linux first; macOS release builds will follow with the launcher.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# llama.cpp compiled in for the opt-in French model (jina-v5-nano): about +4 MB, needs CMake and libclang to build.
features = ["llama"]
# ONNX Runtime ships prebuilt against the dynamic CRT (/MD); a static-CRT build fails to link (__imp_strncpy, __imp_tolower).
msvc-crt-static = false

# The prebuilt static ONNX Runtime 1.31 needs glibc >= 2.38 and GCC 13 (__isoc23_strtol); ubuntu-22.04 has neither.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"

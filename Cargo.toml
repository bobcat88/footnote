[package]
name = "footnote"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
wait-timeout = "0.2"
interprocess = "2.4.8"
getrandom = "0.4.3"
tantivy = "0.27"

[dev-dependencies]
assert_cmd = "2"
interprocess = "2.4.8"
sha2 = "0.10"

# Checks on every pull request and every push to main (ADR 0001). Windows first, Linux from the start; macOS joins with the
# launcher. Only official GitHub actions: Rust comes preinstalled on the runners, nothing third-party runs here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages (Conventional Commits, 72 characters)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 scripts/check-commits.py "$BASE"
          printf '%s\n' "$TITLE" > pr-title.txt
          python3 scripts/check-commits.py --message pr-title.txt

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Test models are public and hash-checked by the script; cached between runs.
      - uses: actions/cache@v4
        with:
          path: artifacts/models
          key: models-${{ hashFiles('tools/provision_embeddings.py') }}
      - name: Test models
        run: python tools/provision_embeddings.py minilm e5-small gte-small

      # PDF extraction runs in this environment (tests/cli.rs).
      - name: Extraction environment
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --quiet -r requirements-extract.lock

      - name: Format
        run: cargo fmt --all --check

      # Every product combination must build cleanly: a company build may leave a product out.
      - name: Clippy, all products
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy, Library only
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features library -- -D warnings
      - name: Clippy, Memory only
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features memory -- -D warnings
      - name: Clippy, with Alias (not released)
        run: cargo clippy --locked --workspace --all-targets --features alias -- -D warnings
      - name: Clippy, with Code (not released)
        run: cargo clippy --locked --workspace --all-targets --features code -- -D warnings
      # Releases include llama.cpp (dist-workspace.toml) for the opt-in French model; it needs CMake and libclang,
      # which both runner images ship.
      - name: Clippy, with llama.cpp
        run: cargo clippy --locked --workspace --all-targets --features llama -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast -- --include-ignored
      - name: Tests, Code (needs rust-analyzer, skipped without it)
        run: cargo test --locked --features code --test code

[package]
name = "footnote-memory"
description = "Footnote Memory: agent memories, recall and pack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
encryption = ["footnote-search/encryption", "dep:getrandom", "dep:sha2", "dep:zeroize", "dep:qrcode", "dep:windows-sys"]

[dependencies]
footnote-core.workspace = true
footnote-search.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
getrandom = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Security_Credentials"] }

[dev-dependencies]
tempfile.workspace = true
quircs = "0.10.3"

[package]
name = "footnote-search"
description = "Footnote search engine: storage schema, keyword and vector search, fusion, records"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
metrics = ["footnote-core/metrics"]
llama = ["dep:llama-cpp-2"]
encryption = ["rusqlite/bundled-sqlcipher-vendored-openssl", "rusqlite/codec", "dep:zeroize", "dep:url"]

[dependencies]
footnote-core.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true
tantivy.workspace = true
ort.workspace = true
tokenizers.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }
url = { workspace = true, optional = true }
